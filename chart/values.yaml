# SA from argo (add some rbac) 
serviceAccountName: argo-workflow
kubectl: v1.27.9
jq: 1.7.1
# create argo event bus with default name in NS for aldaas
EventBus:
  enabled: true

domain: 
tunnel:
  image: ghcr.io/negashev/aldaas
  tag: main
  port: 8080
  # set some random for your aldaas instance
  token: 9fKLQhjGWrHZ3pOSQLKmWlUxoJXkCJqbFs8WeT3EEG8AwKEL4B8YavzXYOApVaXfi2ZVLx77YhsbVyDJTY0l8maSiYKEm6WDyopM
  ingress:
    tlsSecretName: ""
    annotations: 
      # kubernetes.io/tls-acme: "true"
rook:
  storageClassName: ceph-block
  volumeSnapshotClassName: ceph-block
# s3 with backups (source data for aldaas) which update every day for example 
s3:
  existingSecret: ""
  accesskey: ""
  secretkey: ""
  host: minio.server
  port: 80
  bucket: backup
  insecure: true
  prefix: spilo/acid-database/shasum/logical_backups
  suffix: .sql.gz
# database which restore from backup to saas
application:
  image: postgres
  tag: latest
  port: 5432
  storage: 10Gi
  mount: /var/lib/postgresql/data
  args:
    - sh
    - -c
    - >-
      test -f /var/lib/postgresql/data/PG_VERSION && echo "host all all all trust" > /var/lib/postgresql/data/pg_hba.conf;
      shutdown_pg() { echo "[db-for-aldaas] SIGTERM received, shutting down PostgreSQL gracefully..."; pg_ctl stop -m fast -D /var/lib/postgresql/data 2>/dev/null || true; echo "[db-for-aldaas] PostgreSQL stopped cleanly"; exit 0; };
      trap 'shutdown_pg' SIGTERM SIGINT;
      docker-entrypoint.sh postgres &
      PG_PID=$!;
      wait $PG_PID
  command:
  env:
    - name: POSTGRES_PASSWORD
      value: passw0rd
    - name: POSTGRES_USER
      value: aldaas
    - name: POSTGRES_DB
      value: my_db_name
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 1Gi
restore:
  args:
   - gunzip -c /backup.sql.gz | psql -h $ALDAAS_HOST_DAEMON -p 5432 -U $POSTGRES_USER -d $POSTGRES_DB
  command:
   - sh
   - -c
  env:
    - name: PGPASSWORD
      value: passw0rd
    - name: POSTGRES_USER
      value: aldaas
    - name: POSTGRES_DB
      value: my_db_name
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 1Gi
check:
  args:
   - psql -h $ALDAAS_HOST_DAEMON -p 5432 -U $POSTGRES_USER -d $POSTGRES_DB -c "\l"
  command:
   - sh
   - -c
  # pgSslMode: "" — пусто = не добавлять PGSSLMODE
  # pgSslMode: "disable" — добавить PGSSLMODE=disable
  pgSslMode: ""

# resources for EventSource pods (SQS polling, webhook)
eventsource:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 128Mi

# resources for Sensor pods (workflow triggers)
sensor:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 128Mi